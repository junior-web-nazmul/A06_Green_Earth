<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Earth</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./style/style.css">
    <!-- inter font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- js & daisy ui cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header>
        <div class="navbar bg-[#15803D] shadow-sm">
            <div class="navbar-start">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content  rounded-box z-1 mt-3 w-52 p-2 shadow font-medium">
                        <li class="hover:text-[#FACC15] hover:cursor-pointer mt-2">About</li>
                        <li class="hover:text-[#FACC15] hover:cursor-pointer mt-2">Gallery</li>
                        <li class="hover:text-[#FACC15] hover:cursor-pointer mt-2">Plan a Tree</li>
                    </ul>
                </div>
                <a class="font-bold text-xl text-white">Green Earth</a>
            </div>
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal gap-4 px-1 text-white font-medium">
                    <li class="hover:text-[#FACC15] hover:cursor-pointer">About</li>
                    <li class="hover:text-[#FACC15] hover:cursor-pointer">Gallery</li>
                    <li class="hover:text-[#FACC15] hover:cursor-pointer">Plan a Tree</li>
                </ul>
            </div>
            <div class="navbar-end">
                <button class="btn font-medium rounded-3xl border-none text-[#15803D] bg-[#FACC15]">plan a Tree</button>
            </div>
        </div>
    </header>
    <!-- banner section -->
    <div class="flex justify-center text-center p-2 sm:py-8 lg:py-0 bg-[#CFF0DC]">
        <div class=" space-y-3 grid  lg:grid-cols-4 items-center">
            <img class="m-0 col-span-1 hidden lg:block" src="./assets/hero-leaf1.png" alt="">
            <div class="col-span-2">
                <h1 class="text-5xl font-bold min-w-[]">
                    Plant a Tree, Grow a Future
                </h1>
                <P>
                    Join our mission to plant 1 million trees and make the Earth greener for future generations.
                </P>
                <button class="btn font-medium rounded-3xl border-none mt-3 text-[#15803D] bg-[#FACC15]">Get
                    Involved</button>
            </div>
            <img class="col-span-1 hidden lg:block" src="./assets/hero-leaf2.png" alt="">
        </div>




    </div>


    <script src="./script/index.js"></script>
</body>

</html>
